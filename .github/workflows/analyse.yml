name: analyse

# Manual AI runs on request (any subset of stages). The scheduled run is part of daily.yml.
on:
  workflow_dispatch:
    inputs:
      stages:
        description: "comma-separated stages"
        default: screen,rescreen,relevance,tag,translation,crosscheck,stability,embed,themes,metrics
      minutes:
        description: "time budget in minutes"
        default: "60"

concurrency:
  group: analyse
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: pipeline
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-ai.txt
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gte-small-v1
      - run: pip install -r requirements-ai.txt
      - name: Analyse
        run: >
          python -m engine analyse
          --stages ${{ inputs.stages }}
          --minutes ${{ inputs.minutes }}
          --trigger manual
