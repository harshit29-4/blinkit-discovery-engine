name: analyse

# Hourly AI phase A: pre-filter → relevance gate → tagging + translation → translation check.
# Runs at minute 40 (collection runs at 17), time-boxed so runs never overlap, and stops cleanly
# when a model's free daily allowance is used up; the next run picks up where it left off.
on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      stages:
        description: "comma-separated: screen,relevance,tag,translation"
        default: screen,relevance,tag,translation
      minutes:
        description: "time budget in minutes"
        default: "45"

concurrency:
  group: analyse
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: pipeline
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Analyse
        run: >
          python -m engine analyse
          --stages ${{ inputs.stages || 'screen,relevance,tag,translation' }}
          --minutes ${{ inputs.minutes || '45' }}
          --trigger ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
