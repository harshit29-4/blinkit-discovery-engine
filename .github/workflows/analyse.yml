name: analyse

# Hourly AI run: pre-filter → (parallel per model) relevance · tagging + stability · translation check
# + cross-check → embeddings → validation metrics. Runs at minute 40 (collection runs at 17), time-boxed
# so runs never overlap, and stops cleanly when a model's free daily allowance is used up; the next run
# picks up where it left off. Stability re-tags its panel only once per week.
on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      stages:
        description: "comma-separated stages"
        default: screen,relevance,tag,translation,crosscheck,stability,embed,metrics
      minutes:
        description: "time budget in minutes"
        default: "45"

concurrency:
  group: analyse
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: pipeline
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-ai.txt
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gte-small-v1
      - run: pip install -r requirements-ai.txt
      - name: Analyse
        run: >
          python -m engine analyse
          --stages ${{ inputs.stages || 'screen,relevance,tag,translation,crosscheck,stability,embed,metrics' }}
          --minutes ${{ inputs.minutes || '45' }}
          --trigger ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
