name: collect

# Hourly incremental collection into Supabase, plus manual runs (e.g. the 12-month backfill).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental or backfill"
        default: incremental
        type: choice
        options: [incremental, backfill]
      source:
        description: "which source"
        default: all
        type: choice
        options: [all, play_store, app_store, reddit]
  schedule:
    - cron: "17 * * * *"   # hourly, off the top of the hour to avoid GitHub's busiest minute

concurrency:
  group: collect          # never two collection runs at once
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: pipeline
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      AUTHOR_HASH_SALT: ${{ secrets.AUTHOR_HASH_SALT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Collect
        run: >
          python -m engine collect
          --source ${{ inputs.source || 'all' }}
          --mode ${{ inputs.mode || 'incremental' }}
          --store supabase
          --trigger ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
