name: daily

# The whole pipeline, once a day (decision 2026-11-24: hourly runs added moving parts without adding
# output, because AI throughput is capped per day by Groq's free tier: 200k tokens/day per model).
#   1. collect: new Play Store, App Store and Reddit items (incremental)
#   2. analyse: pre-filter, AI relevance, tagging, translation check, cross-check, stability,
#               embeddings, theme discovery, validation metrics, with a budget long enough to use each
#               model's full daily allowance (8k tokens/min → ~25 min per 200k tokens)
# Runs on request too: Actions → daily → Run workflow, or `gh workflow run daily.yml`.
on:
  schedule:
    - cron: "53 20 * * *"   # 02:23 IST, off the hour (GitHub's busiest minutes are delayed most)
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency: { group: collect, cancel-in-progress: false }
    defaults: { run: { working-directory: pipeline } }
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      AUTHOR_HASH_SALT: ${{ secrets.AUTHOR_HASH_SALT }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Collect (incremental)
        run: python -m engine collect --source all --mode incremental --store supabase --trigger schedule

  analyse:
    needs: collect
    if: always()   # analyse what's already collected even if a collector failed
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency: { group: analyse, cancel-in-progress: false }
    defaults: { run: { working-directory: pipeline } }
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements-ai.txt }
      - name: Cache embedding model
        uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-gte-small-v1 }
      - run: pip install -r requirements-ai.txt
      - name: Analyse
        run: >
          python -m engine analyse
          --stages screen,rescreen,relevance,tag,translation,crosscheck,stability,embed,themes,metrics
          --minutes 100 --trigger schedule
