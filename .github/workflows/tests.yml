name: tests

on:
  push:
    paths: ["pipeline/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["pipeline/**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
