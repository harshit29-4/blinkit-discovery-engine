name: tests

on:
  push:
    paths: ["pipeline/**", "web/lib/agent/**", "web/tests/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["pipeline/**", "web/lib/agent/**", "web/tests/**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-ai.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      # The answer-check tests have no dependencies: Node runs the TypeScript directly.
      - run: npm test
