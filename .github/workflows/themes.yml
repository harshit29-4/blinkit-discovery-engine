name: themes

# Daily theme discovery: embeddings catch-up → clustering + AI naming → new published snapshot →
# validation metrics. Shares the "analyse" concurrency group so it never overlaps an hourly run.
on:
  schedule:
    - cron: "5 21 * * *"   # 02:35 IST
  workflow_dispatch:

concurrency:
  group: analyse
  cancel-in-progress: false

jobs:
  themes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: pipeline
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-ai.txt
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gte-small-v1
      - run: pip install -r requirements-ai.txt
      - name: Discover themes
        run: python -m engine analyse --stages embed,themes,metrics --minutes 30 --trigger ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
